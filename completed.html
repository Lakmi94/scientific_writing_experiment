<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162b75">
  <title>Experiment completed</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f6fa;
      color: #162b75;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 520px);
      padding: 40px 28px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 32px rgb(22 43 117 / 12%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 6vw, 32px);
    }

    p {
      margin: 0;
      color: #333;
      font-size: 18px;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      background: #162b75;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #536dc3;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Experiment completed</h1>
    <p>You can go back to the form.</p>
    <a id="return-to-study" href="/index.html">Return to the study</a>
  </main>
  <script>
    const returnPage = new URLSearchParams(window.location.search).get("return");
    if (["/v1.html", "/v2.html", "/v3.html"].includes(returnPage)) {
      document.getElementById("return-to-study").href = returnPage;
    }
  </script>
</body>
</html>
