<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162b75">
  <title>Experiment completed</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f6fa;
      color: #162b75;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 520px);
      padding: 40px 28px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 32px rgb(22 43 117 / 12%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 6vw, 32px);
    }

    p {
      margin: 0;
      color: #333;
      font-size: 18px;
      line-height: 1.5;
    }

    .banner {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 10px;
      background: #eef2ff;
      color: #162b75;
      font-size: 18px;
      font-weight: 700;
      border: 1px solid #c9d4ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Experiment completed</h1>
    <div class="banner">Please go back to the survey</div>
  </main>
</body>
</html>
